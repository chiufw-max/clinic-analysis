<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>股癌心智圖 · 從 2026-05-20 累積</title>
<style>
  :root {
    --bg: #0b1220; --bg-card: #131c2e; --border: #1f2a44;
    --text: #e8eef9; --text-dim: #94a3b8; --text-muted: #64748b;
    --accent: #60a5fa; --green: #22c55e; --red: #ef4444;
    --orange: #f59e0b; --purple: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }
  header {
    padding: 24px 16px 16px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 24px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header .sub { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .back-link {
    display: inline-block; margin-top: 10px;
    color: var(--accent); text-decoration: none;
    font-size: 13px; padding: 4px 12px;
    border: 1px solid var(--border); border-radius: 99px;
  }
  .filters {
    display: flex; gap: 8px; justify-content: center;
    flex-wrap: wrap; padding: 12px 16px;
    background: var(--bg-card); border-bottom: 1px solid var(--border);
  }
  .filter-btn {
    background: var(--bg); color: var(--text-dim);
    border: 1px solid var(--border); padding: 4px 10px;
    border-radius: 99px; font-size: 12px; cursor: pointer;
  }
  .filter-btn.active { color: var(--accent); border-color: var(--accent); }
  .meta-bar {
    text-align: center; padding: 8px 16px;
    color: var(--text-muted); font-size: 12px;
    background: var(--bg-card); border-bottom: 1px solid var(--border);
  }
  .meta-bar b { color: var(--accent); }
  .graph-wrap {
    position: relative; height: calc(100vh - 220px); min-height: 500px;
    overflow: hidden;
  }
  #map-svg { display: block; width: 100%; height: 100%; }
  .tooltip {
    position: absolute; pointer-events: none;
    background: rgba(15, 23, 42, 0.95); color: var(--text);
    padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--accent); font-size: 12px;
    max-width: 280px; line-height: 1.4;
    display: none; z-index: 100;
  }
  .empty-state {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; color: var(--text-dim);
    max-width: 400px; padding: 24px;
  }
  .empty-state h2 { color: var(--text); font-size: 18px; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }
  .empty-state .next-update {
    color: var(--orange); margin-top: 12px; font-weight: 600;
  }
  .legend {
    position: absolute; bottom: 12px; left: 12px;
    background: rgba(19, 28, 46, 0.9); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 11px;
    color: var(--text-dim);
  }
  .legend-row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
</style>
</head>
<body>

<header>
  <h1>🧠 股癌心智圖</h1>
  <div class="sub">從股癌節目累積的個股 · 產業 · 人物 · 事件關係圖</div>
  <a href="../" class="back-link">← 回主頁</a>
</header>

<div class="filters">
  <button class="filter-btn active" data-filter="all">全部</button>
  <button class="filter-btn" data-filter="stock">個股</button>
  <button class="filter-btn" data-filter="industry">產業</button>
  <button class="filter-btn" data-filter="person">人物</button>
  <button class="filter-btn" data-filter="event">事件</button>
  <button class="filter-btn" data-filter="theme">題材</button>
</div>

<div class="meta-bar" id="meta-bar">載入中...</div>

<div class="graph-wrap" id="graph-wrap">
  <svg id="map-svg"></svg>
  <div class="tooltip" id="tooltip"></div>
  <div class="empty-state" id="empty-state" style="display:none;">
    <h2>📅 累積中</h2>
    <p>本心智圖會從股癌每集節目中提及的個股、產業、人物、事件累積關係。</p>
    <p class="next-update">下一集釋出後（週三或週六下午），隔日 05:00 自動更新。</p>
  </div>
  <div class="legend" id="legend">
    <div class="legend-row"><span class="legend-dot" style="background:#22c55e"></span>個股</div>
    <div class="legend-row"><span class="legend-dot" style="background:#f59e0b"></span>產業</div>
    <div class="legend-row"><span class="legend-dot" style="background:#a78bfa"></span>人物</div>
    <div class="legend-row"><span class="legend-dot" style="background:#ef4444"></span>事件</div>
    <div class="legend-row"><span class="legend-dot" style="background:#60a5fa"></span>題材</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const TYPE_COLOR = {
  stock: '#22c55e',
  industry: '#f59e0b',
  person: '#a78bfa',
  event: '#ef4444',
  theme: '#60a5fa',
};
const TYPE_LABEL = {
  stock: '個股', industry: '產業', person: '人物', event: '事件', theme: '題材'
};

let DATA = null;
let currentFilter = 'all';

async function loadData() {
  try {
    const res = await fetch('data.json?v=' + Date.now());
    DATA = await res.json();
  } catch (e) {
    DATA = { updatedAt: '—', episodesCount: 0, nodes: [], links: [] };
  }
  renderMeta();
  renderGraph();
}

function renderMeta() {
  const m = document.getElementById('meta-bar');
  const n = DATA.nodes?.length || 0;
  const l = DATA.links?.length || 0;
  const ep = DATA.episodesCount || 0;
  m.innerHTML = `資料更新：<b>${DATA.updatedAt || '—'}</b> · 起始：<b>${DATA.startDate || '—'}</b> · 累積集數：<b>${ep}</b> · 節點：<b>${n}</b> · 連結：<b>${l}</b>`;
}

function renderGraph() {
  const svg = d3.select('#map-svg');
  svg.selectAll('*').remove();

  const wrap = document.getElementById('graph-wrap');
  const empty = document.getElementById('empty-state');
  const legend = document.getElementById('legend');
  const width = wrap.clientWidth;
  const height = wrap.clientHeight;

  if (!DATA.nodes || DATA.nodes.length === 0) {
    empty.style.display = 'block';
    legend.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  legend.style.display = 'block';

  // Filter
  let nodes = DATA.nodes.map(d => ({...d}));
  if (currentFilter !== 'all') {
    nodes = nodes.filter(n => n.type === currentFilter);
  }
  const nodeIds = new Set(nodes.map(n => n.id));
  const links = DATA.links
    .filter(l => nodeIds.has(typeof l.source === 'string' ? l.source : l.source.id)
              && nodeIds.has(typeof l.target === 'string' ? l.target : l.target.id))
    .map(d => ({...d}));

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(90))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide(36));

  const link = svg.append('g').attr('stroke-opacity', 0.4)
    .selectAll('line').data(links).enter().append('line')
    .attr('stroke', '#94a3b8').attr('stroke-width', d => 0.8 + (d.weight || 1) * 0.5);

  const node = svg.append('g').selectAll('g').data(nodes).enter().append('g')
    .call(d3.drag()
      .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
      .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append('circle')
    .attr('r', d => 14 + Math.min(8, (d.episodes?.length || 1) * 1.5))
    .attr('fill', d => TYPE_COLOR[d.type] || '#888')
    .attr('stroke', '#fff').attr('stroke-width', 1.5);

  node.append('text')
    .attr('text-anchor', 'middle').attr('dy', 4)
    .style('font-size', '11px').style('font-weight', '700')
    .style('fill', '#fff').style('pointer-events', 'none')
    .text(d => d.label);

  // Tooltip
  const tip = document.getElementById('tooltip');
  node.on('mouseover', (e, d) => {
    const eps = d.episodes?.length ? `<br>提及集數：${d.episodes.join(', ')}` : '';
    const last = d.lastSeen ? `<br>最近一次：${d.lastSeen}` : '';
    tip.innerHTML = `<b>${d.label}</b><br>類型：${TYPE_LABEL[d.type] || d.type}${eps}${last}`;
    tip.style.display = 'block';
  }).on('mousemove', e => {
    tip.style.left = (e.offsetX + 20) + 'px';
    tip.style.top = (e.offsetY + 20) + 'px';
  }).on('mouseleave', () => { tip.style.display = 'none'; });

  sim.on('tick', () => {
    link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    node.attr('transform', d => `translate(${d.x},${d.y})`);
  });
}

document.querySelectorAll('.filter-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentFilter = b.dataset.filter;
    renderGraph();
  });
});

window.addEventListener('resize', () => { if (DATA) renderGraph(); });
loadData();
</script>

</body>
</html>
