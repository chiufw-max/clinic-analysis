<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>股癌心智圖 · 觸控版</title>
<style>
  :root {
    --bg: #0b1220; --bg-card: #131c2e; --border: #1f2a44;
    --text: #e8eef9; --text-dim: #94a3b8; --text-muted: #64748b;
    --accent: #60a5fa; --green: #22c55e; --red: #ef4444;
    --orange: #f59e0b; --purple: #a78bfa;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f8fafc; --bg-card: #ffffff; --border: #e2e8f0; --text: #0f172a; --text-dim: #475569; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
    overscroll-behavior: none;
  }
  header {
    padding: 18px 16px 12px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }
  header .sub { color: var(--text-dim); font-size: 12px; }
  .back-link {
    display: inline-block; margin-top: 8px;
    color: var(--accent); text-decoration: none;
    font-size: 13px; padding: 6px 14px;
    border: 1px solid var(--border); border-radius: 99px;
    min-height: 32px; line-height: 1.4;
  }
  /* 操作說明 */
  .tip-bar {
    padding: 10px 16px; text-align: center;
    background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(96,165,250,0.04));
    border-bottom: 1px solid var(--border);
    color: var(--text-dim); font-size: 12px;
    line-height: 1.7;
  }
  .tip-bar b { color: var(--orange); }
  /* 篩選 / 控制列 */
  .controls {
    display: flex; gap: 6px; justify-content: center;
    flex-wrap: wrap; padding: 8px 12px;
    background: var(--bg-card); border-bottom: 1px solid var(--border);
  }
  .ctrl-btn {
    background: var(--bg); color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 8px 14px; min-height: 36px;
    border-radius: 99px; font-size: 13px; cursor: pointer;
    -webkit-tap-highlight-color: rgba(96,165,250,0.3);
  }
  .ctrl-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(96,165,250,0.1); }
  .action-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 8px 14px; min-height: 36px;
    border-radius: 99px; font-size: 13px; font-weight: 600;
  }
  .meta-bar {
    text-align: center; padding: 6px 16px;
    color: var(--text-muted); font-size: 11px;
    background: var(--bg-card); border-bottom: 1px solid var(--border);
  }
  .meta-bar b { color: var(--accent); }
  .graph-wrap {
    position: relative;
    height: calc(100vh - 240px); min-height: 420px;
    overflow: hidden;
    touch-action: none;  /* 關鍵：讓 D3 zoom 接管所有觸控手勢 */
  }
  #map-svg { display: block; width: 100%; height: 100%; cursor: grab; }
  #map-svg:active { cursor: grabbing; }
  .empty-state {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; color: var(--text-dim);
    max-width: 320px; padding: 24px;
  }
  .empty-state h2 { color: var(--text); font-size: 17px; margin-bottom: 8px; }
  .empty-state p { font-size: 13px; line-height: 1.7; }
  .empty-state .next-update { color: var(--orange); margin-top: 12px; font-weight: 600; }
  .legend {
    position: absolute; bottom: 12px; left: 12px;
    background: rgba(19, 28, 46, 0.92); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 11px;
    color: var(--text-dim);
    backdrop-filter: blur(8px);
  }
  .legend-row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  /* 觸控節點細節彈窗 */
  .node-detail {
    position: fixed; bottom: 16px; right: 16px; left: 16px;
    max-width: 380px; margin-left: auto;
    background: rgba(19, 28, 46, 0.97); border: 1px solid var(--accent);
    border-radius: 12px; padding: 14px 16px;
    font-size: 13px; line-height: 1.6;
    display: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 200;
  }
  .node-detail .close {
    position: absolute; top: 6px; right: 10px;
    color: var(--text-muted); font-size: 18px; cursor: pointer;
    width: 28px; height: 28px; text-align: center; line-height: 28px;
  }
  .node-detail b { color: var(--accent); }
  /* 縮放控制 */
  .zoom-ctrl {
    position: absolute; bottom: 12px; right: 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .zoom-ctrl button {
    width: 38px; height: 38px;
    background: rgba(19, 28, 46, 0.92); border: 1px solid var(--border);
    color: var(--text); font-size: 18px; font-weight: 700;
    border-radius: 8px; cursor: pointer;
    backdrop-filter: blur(8px);
  }
  .zoom-ctrl button:active { background: var(--accent); color: #fff; }
</style>
</head>
<body>

<header>
  <h1>🧠 股癌心智圖</h1>
  <div class="sub">從股癌每集累積的個股 · 產業 · 人物 · 事件關係</div>
  <a href="../" class="back-link">← 回主頁</a>
</header>

<div class="tip-bar">
  <b>📱 手機操作：</b>一指拖移節點 · 兩指捏縮放 · 點節點看詳情 · 雙擊空白重設視角
</div>

<div class="controls">
  <button class="ctrl-btn active" data-filter="all">全部</button>
  <button class="ctrl-btn" data-filter="stock">個股</button>
  <button class="ctrl-btn" data-filter="industry">產業</button>
  <button class="ctrl-btn" data-filter="person">人物</button>
  <button class="ctrl-btn" data-filter="event">事件</button>
  <button class="ctrl-btn" data-filter="theme">題材</button>
  <button class="action-btn" id="reset-btn">🔄 重排</button>
</div>

<div class="meta-bar" id="meta-bar">載入中⋯</div>

<div class="graph-wrap" id="graph-wrap">
  <svg id="map-svg"></svg>
  <div class="empty-state" id="empty-state" style="display:none;">
    <h2>📅 累積中</h2>
    <p>本心智圖會把股癌每集提到的個股、產業、人物、事件累加成關係網路。</p>
    <p class="next-update">下一集（週三或週六下午）釋出後，隔日 05:06 自動更新。</p>
  </div>
  <div class="legend" id="legend">
    <div class="legend-row"><span class="legend-dot" style="background:#22c55e"></span>個股</div>
    <div class="legend-row"><span class="legend-dot" style="background:#f59e0b"></span>產業</div>
    <div class="legend-row"><span class="legend-dot" style="background:#a78bfa"></span>人物</div>
    <div class="legend-row"><span class="legend-dot" style="background:#ef4444"></span>事件</div>
    <div class="legend-row"><span class="legend-dot" style="background:#60a5fa"></span>題材</div>
  </div>
  <div class="zoom-ctrl">
    <button id="zoom-in">＋</button>
    <button id="zoom-out">－</button>
    <button id="zoom-fit" style="font-size:14px;">⊡</button>
  </div>
  <div class="node-detail" id="node-detail">
    <span class="close" id="detail-close">×</span>
    <div id="detail-content"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const TYPE_COLOR = {
  stock: '#22c55e', industry: '#f59e0b', person: '#a78bfa', event: '#ef4444', theme: '#60a5fa',
};
const TYPE_LABEL = {
  stock: '個股', industry: '產業', person: '人物', event: '事件', theme: '題材'
};

let DATA = null;
let currentFilter = 'all';
let simulation = null;
let zoomBehavior = null;
let svgG = null;  // 內層 g 元素，套用 zoom transform

async function loadData() {
  try {
    const res = await fetch('data.json?v=' + Date.now());
    DATA = await res.json();
  } catch (e) {
    DATA = { updatedAt: '—', episodesCount: 0, nodes: [], links: [] };
  }
  renderMeta();
  renderGraph();
}

function renderMeta() {
  const m = document.getElementById('meta-bar');
  const n = DATA.nodes?.length || 0;
  const l = DATA.links?.length || 0;
  const ep = DATA.episodesCount || 0;
  m.innerHTML = `更新：<b>${DATA.updatedAt || '—'}</b> · 集數：<b>${ep}</b> · 節點：<b>${n}</b> · 連結：<b>${l}</b>`;
}

function renderGraph() {
  const svg = d3.select('#map-svg');
  svg.selectAll('*').remove();

  const wrap = document.getElementById('graph-wrap');
  const empty = document.getElementById('empty-state');
  const legend = document.getElementById('legend');
  const width = wrap.clientWidth;
  const height = wrap.clientHeight;
  // 是否手機（決定節點大小）
  const isMobile = width < 768;
  const nodeRadius = isMobile ? 22 : 16;

  if (!DATA.nodes || DATA.nodes.length === 0) {
    empty.style.display = 'block';
    legend.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  legend.style.display = 'block';

  // 篩選
  let nodes = DATA.nodes.map(d => ({...d}));
  if (currentFilter !== 'all') {
    nodes = nodes.filter(n => n.type === currentFilter);
  }
  const nodeIds = new Set(nodes.map(n => n.id));
  const links = DATA.links
    .filter(l => nodeIds.has(typeof l.source === 'string' ? l.source : l.source.id)
              && n
